<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.author }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header>
      <a class="site-name" href="/">{{ site.author }}</a>
      <a class="about-btn" href="/about/">about</a>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <a href="https://github.com/{{ site.github_username }}">github</a>
      <a href="#">linkedin</a>
      <a href="https://substack.com/@chinmayabharadwaj/notes">substack</a>
      <span>© {{ site.time | date: "%Y" }}</span>
    </footer>
  </div>
</body>
</html>
